<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found - Joinly</title>

    <link
        rel="icon"
        href="https://cdn.discordapp.com/avatars/1528785988237922304/f57cf1a20aa0da13d47f6e8bcba77ec7.png?size=2048"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --background: #08090b;
            --card: #111316;

            --text: #f2f3f5;
            --muted: #92969f;
            --muted-strong: #b7bbc2;

            --border: rgba(255, 255, 255, 0.075);
            --border-strong: rgba(255, 255, 255, 0.13);

            --shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                0 8px 30px rgba(0, 0, 0, 0.2);

            --transition: 0.22s cubic-bezier(.2, .8, .2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                "Inter",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(255, 255, 255, 0.065),
                    transparent 36%
                ),
                radial-gradient(
                    circle at 50% 110%,
                    rgba(255, 255, 255, 0.02),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #0a0b0d 0%,
                    #08090b 55%,
                    #070809 100%
                );

            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                );

            background-size: 48px 48px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 0%,
                    transparent 72%
                );
        }

        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: rgba(255, 255, 255, 0.025);

            filter: blur(100px);
            border-radius: 50%;

            pointer-events: none;
        }

        .error-page {
            width: 100%;
            max-width: 650px;

            position: relative;
            z-index: 1;

            text-align: center;
        }

        .error-card {
            position: relative;

            padding: 62px 52px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.025),
                    rgba(255, 255, 255, 0.008)
                ),
                var(--card);

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .error-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;
            right: 15%;

            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.12),
                transparent
            );
        }

        .error-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            padding: 7px 12px;

            border: 1px solid var(--border-strong);
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.035);

            color: var(--muted-strong);

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .error-label span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #777c85;
        }

        h1 {
            max-width: 540px;

            margin: 25px auto 0;

            font-size: clamp(34px, 6vw, 52px);
            line-height: 1.05;

            font-weight: 700;
            letter-spacing: -0.055em;
        }

        .description {
            max-width: 500px;

            margin: 18px auto 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.75;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-height: 46px;

            margin-top: 30px;
            padding: 0 20px;

            border: 1px solid #f2f3f5;
            border-radius: 9px;

            background: #f2f3f5;
            color: #090a0c;

            font-family: inherit;
            font-size: 13px;
            font-weight: 600;

            text-decoration: none;

            transition:
                transform var(--transition),
                background var(--transition),
                box-shadow var(--transition);
        }

        .back-button svg {
            width: 15px;
            height: 15px;

            transition: transform var(--transition);
        }

        .back-button:hover {
            background: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .back-button:hover svg {
            transform: translateX(-2px);
        }

        .back-button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 20px;

            color: #5f636b;

            font-size: 11px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .error-card {
                padding: 50px 24px 44px;
                border-radius: 16px;
            }

            h1 {
                font-size: clamp(32px, 9vw, 42px);
            }

            .description {
                font-size: 13px;
                line-height: 1.7;
            }

            .back-button {
                width: 100%;
                margin-top: 26px;
            }
        }

        @media (max-width: 360px) {
            .error-card {
                padding: 44px 18px 38px;
            }

            h1 {
                font-size: 30px;
            }

            .error-label {
                font-size: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .back-button,
            .back-button svg {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">
        <section class="error-card">

            <div class="error-label">
                <span></span>
                Page Not Found
            </div>

            <h1>
                Well, this is awkward.
            </h1>

            <p class="description">
                We looked everywhere for this page.
                Turns out, it decided to leave the server without telling anyone.
            </p>

            <a href="/" class="back-button">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>

                Back to Joinly
            </a>

        </section>

        <div class="footer">
            Joinly · Powering Discord communities.
        </div>
    </main>

</body>
</html>
